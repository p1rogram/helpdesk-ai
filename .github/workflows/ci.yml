name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      # AI: worker импортирует собранный API (dist), поэтому оба должны существовать до typecheck.
      - run: npm run build -w @helpdesk/shared && npm run build -w @helpdesk/api
      - run: npx prettier --check "apps/*/src/**/*.{ts,tsx,css}" "packages/*/src/**/*.ts"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @helpdesk/api
      - run: npm run build
      - name: Personal-data gate (knowledge corpus)
        run: node scripts/check-personal-data.mjs

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
