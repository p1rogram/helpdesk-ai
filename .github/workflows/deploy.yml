name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build -w @helpdesk/shared
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -w @helpdesk/api
      - run: npm run build -w @helpdesk/api
      - name: Personal-data gate (knowledge corpus)
        run: node scripts/check-personal-data.mjs

  build:
    name: Build and push ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [api, worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Roll out on the server
    runs-on: ubuntu-latest
    needs: build
    environment: production
    steps:
      # AI: Either SSH_KEY (private key) or SSH_PASSWORD works; set the one you have.
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT || 22 }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -e
            cd ${{ secrets.APP_DIR }}
            git fetch --all --prune
            git reset --hard origin/master
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export IMAGE_PREFIX=${{ env.IMAGE_PREFIX }} IMAGE_TAG=${{ github.sha }}
            docker compose pull api worker web
            docker compose up -d --remove-orphans
            docker image prune -f
            for i in $(seq 1 30); do
              curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1 && exit 0 || sleep 2
            done
            echo "API did not become healthy"; docker compose logs --tail=50 api; exit 1
