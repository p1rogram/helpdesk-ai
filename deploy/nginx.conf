# AI: Reverse-proxy config for a host where nginx already owns ports 80/443.
# Install: copy to /etc/nginx/sites-available/helpdesk, symlink into sites-enabled, then
#   sudo certbot --nginx -d DOMAIN   (or paste your own certificate paths below)
#   sudo nginx -t && sudo systemctl reload nginx
# The app container listens on 127.0.0.1:8081 (WEB_HTTP_BIND in .env) and serves both the site
# and /api/*; nginx only needs one upstream. Streaming (SSE) requires proxy_buffering off.

upstream helpdesk_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    # certbot fills these in; otherwise point them at your certificate
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://helpdesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        # Server-Sent Events (chat answers, operator queue): no buffering, long timeouts.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
