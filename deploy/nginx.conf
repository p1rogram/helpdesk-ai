# AI: Конфиг reverse-proxy для хоста, где nginx уже занимает порты 80/443.
# Установка: скопировать в /etc/nginx/sites-available/helpdesk, сделать симлинк в sites-enabled,
# затем
#   sudo certbot --nginx -d DOMAIN   (или вписать пути к своему сертификату ниже)
#   sudo nginx -t && sudo systemctl reload nginx
# Контейнер приложения слушает 127.0.0.1:8081 (WEB_HTTP_BIND в .env) и отдаёт и сайт, и /api/*;
# nginx нужен один upstream. Стриминг (SSE) требует proxy_buffering off.

upstream helpdesk_app {
    server 127.0.0.1:8081;
    keepalive 32;
}

server {
    listen 80;
    server_name DOMAIN;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name DOMAIN;

    # certbot заполняет это сам; иначе укажите пути к своему сертификату
    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    client_max_body_size 1m;

    location / {
        proxy_pass http://helpdesk_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection        "";

        # Server-Sent Events (ответы чата, очередь оператора): без буферизации, длинные таймауты.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
